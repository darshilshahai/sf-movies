name: Continuous Integration (CI)

on:
  push:
    branches: [ main, development, production ]
  pull_request:
    branches: [ main, development, production ]

jobs:
  backend-ci:
    name: Backend CI (FastAPI + Pytest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install backend dependencies
        run: |
          cd backend
          uv sync

      - name: Run Pytest test suite
        run: |
          cd backend
          uv run pytest -v

  frontend-ci:
    name: Frontend CI (React + Vitest + TypeScript)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Vitest test suite
        run: |
          cd frontend
          npm test

      - name: Build frontend production bundle
        run: |
          cd frontend
          npm run build
